<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼎盛轩 · 豪华中式大酒楼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #FBF9F5; color: #2C221E; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

<body class="pb-28 flex flex-col h-screen overflow-hidden">

    <!-- 顶端流光跑马灯公告条 -->
    <div class="bg-gradient-to-r from-[#D4AF37] via-[#E6C687] to-[#D4AF37] text-[#2C221E] text-xs font-bold py-2 overflow-hidden whitespace-nowrap shadow-sm flex-shrink-0">
        <div class="animate-marquee inline-block">
            ✨ 欢迎光临【鼎盛轩】豪华大酒楼！今日生猛澳洲大龙虾、游水海鲜空运直达！贵宾订座专线：012-XXXXXXX ✨ 消费满 RM150 尊享主厨精美甜品一份 ✨
        </div>
    </div>

    <!-- 顶部沉浸式招牌区 -->
    <div class="relative bg-cover bg-center py-5 px-4 text-center border-b border-[#E6D5B8] overflow-hidden flex-shrink-0 shadow-md" style="background-image: url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=80')">
        <div class="absolute inset-0 bg-gradient-to-t from-[#2C221E]/95 via-[#2C221E]/65 to-black/40 backdrop-blur-[1px]"></div>
        <div class="relative z-10 flex flex-col items-center">
            <h1 class="text-3xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-[#F3E5AB] via-[#FFD700] to-[#F3E5AB] drop-shadow-[0_2px_8px_rgba(0,0,0,0.8)]">
                鼎盛轩
            </h1>
            <p class="text-[11px] text-[#E6D5B8] tracking-widest mt-1 uppercase font-semibold">DIING SHENG XUAN · GRAND SEAFOOD & ZICHAR</p>
            <div class="flex items-center space-x-2 mt-2">
                <div class="bg-black/50 border border-[#D4AF37]/60 px-3 py-0.5 rounded-full text-xs text-[#FFD700] shadow-inner backdrop-blur-md">
                    📍 尊贵堂食桌位：<span class="font-bold text-white">A08 桌</span>
                </div>
                <!-- 新增：查看今日已点订单按钮 -->
                <button onclick="toggleTodayOrdersModal()" class="bg-[#D4AF37] text-white border border-[#FFD700] px-3 py-0.5 rounded-full text-xs font-bold shadow transition active:scale-95 flex items-center space-x-1">
                    <span>📜 今日已点</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 顶部横向滚动分类导航条 -->
    <div class="bg-[#F2EDE4] border-b border-[#E6D5B8] px-3 py-2.5 flex space-x-2.5 overflow-x-auto no-scrollbar flex-shrink-0 shadow-sm">
        <button onclick="filterMenu('seafood')" id="btn-seafood" class="cat-btn flex-shrink-0 px-4 py-2 rounded-xl text-sm font-bold bg-[#D4AF37] text-white shadow transition">
            🦐 生猛海鲜
        </button>
        <button onclick="filterMenu('meat')" id="btn-meat" class="cat-btn flex-shrink-0 px-4 py-2 rounded-xl text-sm font-medium bg-white text-[#5C4A42] border border-[#E6D5B8] shadow-sm transition">
            🥩 招牌肉类
        </button>
        <button onclick="filterMenu('fry')" id="btn-fry" class="cat-btn flex-shrink-0 px-4 py-2 rounded-xl text-sm font-medium bg-white text-[#5C4A42] border border-[#E6D5B8] shadow-sm transition">
            🍳 滋味小炒
        </button>
        <button onclick="filterMenu('veg')" id="btn-veg" class="cat-btn flex-shrink-0 px-4 py-2 rounded-xl text-sm font-medium bg-white text-[#5C4A42] border border-[#E6D5B8] shadow-sm transition">
            🥬 爽口时蔬
        </button>
        <button onclick="filterMenu('staple')" id="btn-staple" class="cat-btn flex-shrink-0 px-4 py-2 rounded-xl text-sm font-medium bg-white text-[#5C4A42] border border-[#E6D5B8] shadow-sm transition">
            🍚 主食白饭
        </button>
        <button onclick="filterMenu('drink')" id="btn-drink" class="cat-btn flex-shrink-0 px-4 py-2 rounded-xl text-sm font-medium bg-white text-[#5C4A42] border border-[#E6D5B8] shadow-sm transition">
            🥤 饮品甜品
        </button>
    </div>

    <!-- 主体菜单展示区 (整齐并列双列网格) -->
    <div class="flex-1 overflow-y-auto p-3.5 bg-[#FBF9F5]">
        <div id="menu-list" class="grid grid-cols-2 gap-3.5 items-stretch">
            <!-- 动态由 JS 渲染 -->
        </div>
    </div>

    <!-- 底部悬浮购物车栏 -->
    <div class="absolute bottom-0 left-0 right-0 bg-[#FFFDF9]/95 backdrop-blur-xl border-t border-[#E6D5B8] p-4 flex justify-between items-center z-30 shadow-2xl">
        <div onclick="toggleCartModal()" class="cursor-pointer flex items-center space-x-3">
            <div class="relative bg-[#D4AF37] p-3.5 rounded-2xl text-white font-black shadow-md text-lg">
                🛒
                <span id="cart-badge" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center border-2 border-white font-bold">0</span>
            </div>
            <div>
                <div class="text-xs text-[#7A6B63]">已选 <span id="cart-count" class="text-[#2C221E] font-bold text-sm">0</span> 样菜品</div>
                <div class="text-[#C59B27] font-black text-xl">RM <span id="cart-total">0.00</span></div>
            </div>
        </div>
        <button onclick="toggleCartModal()" class="bg-gradient-to-r from-[#D4AF37] to-[#C59B27] text-white px-6 py-3.5 rounded-xl font-bold text-sm shadow-md transition active:scale-95">
            查看已点清单 ➔
        </button>
    </div>

            <div class="flex justify-between items-center border-b border-[#E6D5B8] pb-3 mb-4">
                <h3 id="modal-dish-title" class="text-base font-black text-[#2C221E]">加入菜品确认</h3>
                <button onclick="closeDishModal()" class="text-[#7A6B63] hover:text-[#2C221E] text-lg font-bold">✕</button>
            </div>
            
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-semibold text-[#5C4A42]">选择数量：</span>
                    <div class="flex items-center space-x-3">
                        <button onclick="adjustModalQty(-1)" class="w-8 h-8 bg-[#F2EDE4] text-[#C59B27] rounded-full font-bold flex items-center justify-center text-base shadow-sm">-</button>
                        <span id="modal-dish-qty" class="text-[#2C221E] font-black text-lg w-6 text-center">1</span>
                        <button onclick="adjustModalQty(1)" class="w-8 h-8 bg-[#D4AF37] text-white rounded-full font-bold flex items-center justify-center text-base shadow-sm">+</button>
                    </div>
                </div>

                    <label class="text-xs font-bold text-[#C59B27] block">🐟 推荐烹饪做法（可选）：</label>
                    <div class="flex flex-wrap gap-2">
                        <button type="button" onclick="setNoteTag('清蒸')" class="text-xs bg-[#F2EDE4] text-[#5C4A42] border border-[#E6D5B8] px-3 py-1 rounded-full transition">清蒸</button>
                        <button type="button" onclick="setNoteTag('港蒸')" class="text-xs bg-[#F2EDE4] text-[#5C4A42] border border-[#E6D5B8] px-3 py-1 rounded-full transition">港蒸</button>
                        <button type="button" onclick="setNoteTag('娘惹')" class="text-xs bg-[#F2EDE4] text-[#5C4A42] border border-[#E6D5B8] px-3 py-1 rounded-full transition">娘惹</button>
                        <button type="button" onclick="setNoteTag('潮州蒸')" class="text-xs bg-[#F2EDE4] text-[#5C4A42] border border-[#E6D5B8] px-3 py-1 rounded-full transition">潮州蒸</button>
                        <button type="button" onclick="setNoteTag('姜葱')" class="text-xs bg-[#F2EDE4] text-[#5C4A42] border border-[#E6D5B8] px-3 py-1 rounded-full transition">姜葱</button>

                </div>

                <button onclick="toggleCartModal()" class="text-[#7A6B63] hover:text-[#2C221E] text-xl font-bold px-2">✕</button>

        let cart = {};
        let activeModalDishId = null;
        let currentModalQty = 1;

        function renderMenu(category = 'seafood') {
            const container = document.getElementById('menu-list');
            container.innerHTML = '';

            const filtered = dishes.filter(d => d.cat === category);

            filtered.forEach(dish => {
                let totalQtyForDish = 0;
                if (cart[dish.id]) {
                    cart[dish.id].forEach(item => totalQtyForDish += item.qty);
                }

                const priceDisplay = dish.isMarket ? '<span class="text-[#D4AF37] font-black text-base">时价</span>' : `<span class="text-[#C59B27] font-black text-base">RM ${dish.price.toFixed(2)}</span>`;

                const html = `
                    <div class="bg-white border border-[#E6D5B8] rounded-2xl p-3 shadow-sm flex flex-col justify-between transition hover:shadow-md">
                        <div class="relative w-full h-40 rounded-xl overflow-hidden mb-3 bg-[#F2EDE4] flex-shrink-0">
                            <img src="${dish.img}" alt="${dish.name}" class="w-full h-full object-cover">
                            ${dish.isRec ? `
                                <div class="absolute top-2 left-2 z-20 bg-black/60 backdrop-blur-md text-amber-300 border border-amber-400/50 text-[11px] font-black px-2 py-0.5 rounded-lg shadow flex items-center space-x-1">
                                    <span>👨‍🍳 厨师推荐</span>
                                </div>
                            ` : ''}
                        </div>

                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <h4 class="font-black text-[#2C221E] text-base leading-snug line-clamp-2">${dish.name}</h4>
                                <p class="text-xs text-[#7A6B63] line-clamp-2 mt-1.5 leading-relaxed">${dish.desc}</p>
                            </div>

                            <div class="flex justify-between items-center mt-3.5 pt-2.5 border-t border-[#F2EDE4]">
                                ${priceDisplay}
                                <div class="flex items-center space-x-1.5">
                                    ${totalQtyForDish > 0 ? `
                                        <span class="text-[#C59B27] font-bold text-xs bg-[#F2EDE4] px-2 py-1 rounded-lg">已选 ${totalQtyForDish}</span>
                                    ` : ''}
                                    <button onclick="openDishModal(${dish.id})" class="bg-gradient-to-r from-[#D4AF37] to-[#C59B27] text-white px-4 py-2 rounded-full text-xs font-bold shadow active:scale-95 transition">
                                        加入 +
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function filterMenu(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn flex-shrink-0 px-4 py-2 rounded-xl text-sm font-medium bg-white text-[#5C4A42] border border-[#E6D5B8] shadow-sm transition";
            });
            const activeBtn = document.getElementById(`btn-${cat}`);
            if(activeBtn) {
                activeBtn.className = "cat-btn flex-shrink-0 px-4 py-2 rounded-xl text-sm font-bold bg-[#D4AF37] text-white shadow transition";
            }
            renderMenu(cat);
        }

        function openDishModal(dishId) {
            activeModalDishId = dishId;
            currentModalQty = 1;
            const dish = dishes.find(d => d.id === dishId);
            document.getElementById('modal-dish-title').innerText = `确认加入：${dish.name}`;
            document.getElementById('modal-dish-qty').innerText = currentModalQty;
            document.getElementById('dish-custom-note').value = '';

            // 如果是鱼类或海鲜类，展示专属做法标签；否则隐藏或按需展示
            const seafoodTags = document.getElementById('seafood-tags-container');
            if (dish.cat === 'seafood' || dish.name.includes('鱼') || dish.name.includes('虾') || dish.name.includes('蟹') || dish.name.includes('斑')) {
                seafoodTags.style.display = 'block';
            } else {
                seafoodTags.style.display = 'none';
            }

            document.getElementById('dish-modal').classList.remove('hidden');
        }

        function closeDishModal() {
            document.getElementById('dish-modal').classList.add('hidden');
            activeModalDishId = null;
        }

        function adjustModalQty(change) {
            currentModalQty += change;
            if (currentModalQty < 1) currentModalQty = 1;
            document.getElementById('modal-dish-qty').innerText = currentModalQty;
        }

        function setNoteTag(tagText) {
            const input = document.getElementById('dish-custom-note');
            if (input.value) {
                input.value += `、${tagText}`;
            } else {
                input.value = tagText;
            }
        }

        function confirmAddDish() {
            if (!activeModalDishId) return;
            const note = document.getElementById('dish-custom-note').value.trim();

            if (!cart[activeModalDishId]) {
                cart[activeModalDishId] = [];
            }

            let existing = cart[activeModalDishId].find(item => item.note === note);
            if (existing) {
                existing.qty += currentModalQty;
            } else {
                cart[activeModalDishId].push({ qty: currentModalQty, note: note });
            }

            updateCartUI();
            closeDishModal();

            const activeBtn = document.querySelector('.cat-btn.bg-\\[\\#D4AF37\\]');
            let activeCat = 'seafood';
            if(activeBtn) {
                activeCat = activeBtn.id.replace('btn-', '');
            }
            renderMenu(activeCat);
        }

        function updateCartItemQty(dishId, index, change) {
            cart[dishId][index].qty += change;
            if (cart[dishId][index].qty <= 0) {
                cart[dishId].splice(index, 1);
            }
            if (cart[dishId].length === 0) {
                delete cart[dishId];
            }
            updateCartUI();
            
            const activeBtn = document.querySelector('.cat-btn.bg-\\[\\#D4AF37\\]');
            let activeCat = 'seafood';
            if(activeBtn) {
                activeCat = activeBtn.id.replace('btn-', '');
            }
            renderMenu(activeCat);
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;
            let container = document.getElementById('cart-items-container');
            container.innerHTML = '';

            const keys = Object.keys(cart);
            if (keys.length === 0) {
                container.innerHTML = `<p class="text-center text-[#7A6B63] py-6 text-sm">购物车空空如也，快去挑选美味吧~</p>`;
            } else {
                keys.forEach(dishId => {
                    const dish = dishes.find(d => d.id == dishId);
                    cart[dishId].forEach((cartItem, idx) => {
                        totalCount += cartItem.qty;
                        const itemPrice = dish.isMarket ? 0 : dish.price * cartItem.qty;
                        totalPrice += itemPrice;

                        const priceText = dish.isMarket ? '时价 (现场确认)' : `RM ${itemPrice.toFixed(2)}`;
                        const noteHtml = cartItem.note ? `<div class="text-[11px] text-[#C59B27] mt-0.5 font-medium">备注: ${cartItem.note}</div>` : '';

                        container.innerHTML += `
                            <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-[#E6D5B8]">
                                <div class="flex-1 min-w-0 pr-2">
                                    <h4 class="text-[#2C221E] text-sm font-bold truncate">${dish.name}</h4>
                                    <div class="text-[#C59B27] text-xs mt-0.5 font-bold">${priceText}</div>
                                    ${noteHtml}
                                </div>
                                <div class="flex items-center space-x-2 flex-shrink-0">
                                    <button onclick="updateCartItemQty(${dishId}, ${idx}, -1)" class="w-7 h-7 bg-[#F2EDE4] text-[#C59B27] rounded-full font-bold flex items-center justify-center text-sm">-</button>
                                    <span class="text-[#2C221E] font-bold text-sm w-5 text-center">${cartItem.qty}</span>
                                    <button onclick="updateCartItemQty(${dishId}, ${idx}, 1)" class="w-7 h-7 bg-[#D4AF37] text-white rounded-full font-bold flex items-center justify-center text-sm">+</button>
                                </div>
                            </div>
                        `;
                    });
                });
            }

            document.getElementById('cart-badge').innerText = totalCount;
            document.getElementById('cart-count').innerText = totalCount;
            document.getElementById('cart-total').innerText = totalPrice.toFixed(2);
            document.getElementById('modal-count').innerText = totalCount;
        }

        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        // ==================== 今日已点订单逻辑 (仅限当天) ====================
        function getTodayDateStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function getTodayOrders() {
            try {
                const stored = localStorage.getItem('dsx_today_orders');
                if (!stored) return [];
                const data = JSON.parse(stored);
                // 仅过滤今天的订单
                const todayStr = getTodayDateStr();
                return data.filter(o => o.dateStr === todayStr);
            } catch(e) {
                return [];
            }
        }

        function saveTodayOrder(orderObj) {
            try {
                const todayStr = getTodayDateStr();
                const allOrders = getTodayOrders();
                allOrders.unshift({ ...orderObj, dateStr: todayStr });
                localStorage.setItem('dsx_today_orders', JSON.stringify(allOrders));
            } catch(e) {}
        }

        function toggleTodayOrdersModal() {
            renderTodayOrdersUI();
            const modal = document.getElementById('today-orders-modal');
            modal.classList.toggle('hidden');
        }

        function renderTodayOrdersUI() {
            const container = document.getElementById('today-orders-container');
            const orders = getTodayOrders();
            document.getElementById('today-order-count').innerText = orders.length;

            if (orders.length === 0) {
                container.innerHTML = `<p class="text-center text-[#7A6B63] py-8 text-sm">今天还没有提交过订单哦~</p>`;
                return;
            }

            container.innerHTML = '';
            orders.forEach((ord, index) => {
                let itemsHtml = '';
                ord.items.forEach(i => {
                    itemsHtml += `<div class="text-xs text-[#5C4A42] flex justify-between py-0.5">
                        <span>${i.name} x${i.qty} ${i.note ? '('+i.note+')' : ''}</span>
                        <span class="font-bold">${i.isMarket ? '时价' : 'RM ' + (i.price * i.qty).toFixed(2)}</span>
                    </div>`;
                });

                container.innerHTML += `
                    <div class="bg-white border border-[#E6D5B8] rounded-2xl p-3.5 shadow-sm space-y-2">
                        <div class="flex justify-between items-center border-b border-[#F2EDE4] pb-2">
                            <span class="text-xs font-bold text-[#D4AF37]">第 ${orders.length - index} 轮下单 (${ord.time})</span>
                            <span class="text-[11px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">后厨已出单</span>
                        </div>
                        <div class="space-y-1">
                            ${itemsHtml}
                        </div>
                    </div>
                `;
            });
        }

        function checkoutOrder() {
            const phone = document.getElementById('customer-phone').value.trim();
            let totalCount = 0;
            Object.values(cart).forEach(arr => arr.forEach(item => totalCount += item.qty));

            if (totalCount === 0) {
                alert('请先选择您想享用的菜品！');
                return;
            }
            if (phone.length < 7) {
                alert('为了方便为您出餐及累计会员积分，请输入正确的手机号码！');
                return;
            }

            // 封装今日订单数据
            let orderItemsData = [];
            Object.keys(cart).forEach(dishId => {
                const dish = dishes.find(d => d.id == dishId);
                cart[dishId].forEach(item => {
                    orderItemsData.push({
                        name: dish.name,
                        qty: item.qty,
                        price: dish.price,
                        isMarket: dish.isMarket,
                        note: item.note
                    });
                });
            });

            const nowTime = new Date().toTimeString().substring(0, 5);
            saveTodayOrder({
                time: nowTime,
                items: orderItemsData
            });
